<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truck Route Planner - Mappls</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1d2740; --accent:#ff7a00; --accent2:#22c55e;
    --text:#e8ecf4; --muted:#8d97ad; --danger:#ef4444; --border:#2a3348;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;}
  #sidebar{width:380px;min-width:340px;background:var(--panel);padding:16px;overflow-y:auto;border-right:1px solid var(--border);}
  #map{flex:1;position:relative;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:12px;margin-bottom:16px;}
  fieldset{border:1px solid var(--border);border-radius:8px;margin-bottom:14px;padding:10px 12px;}
  legend{color:var(--accent);font-size:12px;font-weight:600;padding:0 6px;}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;}
  input[type=text], input[type=number]{
    width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:13px;
  }
  .row{display:flex;gap:8px;}
  .row > div{flex:1;}
  .stop-item{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .stop-item input{flex:1;}
  .stop-item button{background:var(--danger);border:none;color:#fff;border-radius:5px;padding:6px 8px;cursor:pointer;font-size:11px;}
  .btn{width:100%;padding:10px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:13px;margin-top:6px;}
  .btn-add{background:var(--panel2);color:var(--accent);border:1px dashed var(--accent);}
  .btn-main{background:var(--accent);color:#111;}
  .btn-main:disabled{opacity:.5;cursor:not-allowed;}
  .btn-clear{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);margin:6px 0;}
  #status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;}
  #result{margin-top:14px;}
  .stat{background:var(--panel2);border-radius:8px;padding:10px;margin-bottom:8px;}
  .stat b{font-size:16px;}
  .flag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;margin-right:6px;margin-top:4px;}
  .flag.on{background:rgba(239,68,68,.2);color:#f87171;}
  .flag.off{background:rgba(34,197,94,.2);color:#4ade80;}
  .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4;}
  details{margin-top:10px;font-size:11px;color:var(--muted);}
  summary{cursor:pointer;color:var(--accent);}
  pre{white-space:pre-wrap;word-break:break-all;background:var(--panel2);padding:8px;border-radius:6px;max-height:200px;overflow:auto;}
  .suggest-box{position:absolute;left:0;right:0;top:100%;background:var(--panel2);border:1px solid var(--border);border-radius:6px;max-height:180px;overflow-y:auto;z-index:50;display:none;}
  .suggest-item{padding:7px 9px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border);}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover{background:var(--panel);}
  .suggest-item small{display:block;color:var(--muted);font-size:10px;margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>🚚 Truck Route Planner</h1>
    <div class="sub">Powered by Mappls — truck size ke hisaab se legal/safe route</div>

    <fieldset>
      <legend>Truck Details</legend>
      <div class="row">
        <div><label>Height (m)</label><input type="number" id="height" step="0.1" value="3.5"></div>
        <div><label>Width (m)</label><input type="number" id="width" step="0.1" value="2.5"></div>
      </div>
      <div class="row">
        <div><label>Length (m)</label><input type="number" id="length" step="0.1" value="10"></div>
        <div><label>Weight (tons)</label><input type="number" id="weight" step="0.1" value="16"></div>
      </div>
      <label>Axle Load (tons)</label>
      <input type="number" id="axle_load" step="0.1" value="9">
      <div class="chk"><input type="checkbox" id="hazmat"> <label style="margin:0" for="hazmat">Carrying hazardous material</label></div>
      <div class="chk"><input type="checkbox" id="avoidToll"> <label style="margin:0" for="avoidToll">Avoid toll roads</label></div>
      <div class="chk"><input type="checkbox" id="showTraffic"> <label style="margin:0" for="showTraffic">Show live traffic</label></div>
    </fieldset>

    <fieldset>
      <legend>Route Points</legend>
      <div class="hint">Jagah ka naam type karo (jaise "Sangamner") aur list mein se select karo. Map par click karke bhi point add kar sakte ho, ya current location button use karo.</div>

      <label>Source</label>
      <div style="position:relative">
        <input type="text" id="pt-source" placeholder="Jagah ka naam ya lat,lng" autocomplete="off">
        <div class="suggest-box" id="suggest-source"></div>
      </div>
      <button class="btn btn-add" id="useMyLocBtn" style="margin-top:6px">📍 Use my current location</button>

      <div id="stops-container"></div>
      <button class="btn btn-add" id="addStopBtn">+ Add Stop</button>

      <label style="margin-top:10px">Destination</label>
      <div style="position:relative">
        <input type="text" id="pt-dest" placeholder="Jagah ka naam ya lat,lng" autocomplete="off">
        <div class="suggest-box" id="suggest-dest"></div>
      </div>
    </fieldset>

    <button class="btn btn-main" id="getRouteBtn">Get Truck Route</button>
    <button class="btn btn-main" id="startNavBtn" style="background:var(--accent2);color:#111;" disabled>🧭 Start Navigation</button>
    <button class="btn btn-clear" id="stopNavBtn" style="display:none;border-color:var(--danger);color:#f87171;">⏹ Stop Navigation</button>
    <button class="btn btn-clear" id="clearBtn">Clear All</button>
    <div id="status"></div>

    <div id="result"></div>
  </div>
  <div id="map">
    <div id="navBanner" style="display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:100;text-align:center;min-width:260px;">
      <div id="navInstruction" style="font-weight:600;"></div>
      <div id="navDistance" style="font-size:12px;color:#9ca3af;margin-top:2px;"></div>
    </div>
  </div>
</div>

<script>
  var map, clickMarkers = [], routeLayerAdded = false;
  var allPoints = [];          // {lat,lng} of every source/stop/dest/click pin, survives traffic re-init
  var lastRouteGeometry = null, lastRestricted = false;
  var currentCenter = [22.9734, 78.6569], currentZoom = 4.5;

  function setStatus(msg, isError){
    var el = document.getElementById('status');
    el.textContent = msg || '';
    el.style.color = isError ? '#f87171' : '#8d97ad';
  }

  // ---- Get map key from our own backend, then load Mappls Map SDK ----
  fetch('/api/map-key').then(function(r){ return r.json(); }).then(function(d){
    var s = document.createElement('script');
    s.src = "https://apis.mappls.com/advancedmaps/api/" + d.key + "/map_sdk?layer=vector&v=3.0&callback=onMapSdkReady";
    s.async = true;
    window.onMapSdkReady = initMap;
    document.head.appendChild(s);
  }).catch(function(err){
    setStatus('Backend se map key nahi mili. Server chal raha hai? (' + err.message + ')', true);
  });

  function initMap(){
    buildMap(false);
  }

  function buildMap(trafficOn){
    try{
      map = new mappls.Map('map', { center: currentCenter, zoom: currentZoom, traffic: !!trafficOn });
      map.on('load', function(){
        map.on('click', function(e){
          handleMapClick(e.lngLat.lat, e.lngLat.lng);
        });
        map.on('moveend', function(){
          try{ var c = map.getCenter(); currentCenter = [c.lng, c.lat]; currentZoom = map.getZoom(); }catch(e){}
        });
        // redraw anything we had before this rebuild (e.g. after toggling traffic)
        allPoints.forEach(function(p){ dropPin(p.lat, p.lng, true); });
        if(lastRouteGeometry){
          map.addSource('route-src', { type:'geojson', data: {type:'Feature', geometry: lastRouteGeometry} });
          map.addLayer({
            id:'route-line', type:'line', source:'route-src',
            paint: { 'line-color': lastRestricted ? '#ef4444' : '#22c55e', 'line-width': 5 }
          });
          routeLayerAdded = true;
        }
      });
    }catch(err){
      setStatus('Map load fail hua: ' + err.message, true);
    }
  }

  // ---- Place search (autosuggest) ----
  var searchTimers = {};
  function wireSuggest(inputId, boxId){
    var input = document.getElementById(inputId);
    var box = document.getElementById(boxId);
    input.addEventListener('input', function(){
      var q = input.value.trim();
      clearTimeout(searchTimers[inputId]);
      if(q.length < 3){ box.style.display = 'none'; return; }
      searchTimers[inputId] = setTimeout(function(){
        fetch('/api/search?q=' + encodeURIComponent(q))
          .then(function(r){ return r.json(); })
          .then(function(data){
            var list = data.suggestedLocations || data.suggestions || [];
            if(!list.length){ box.style.display = 'none'; return; }
            box.innerHTML = '';
            list.slice(0, 8).forEach(function(item){
              var div = document.createElement('div');
              div.className = 'suggest-item';
              var title = item.placeName || item.placeAddress || item.eLoc || 'Unknown';
              var sub = item.placeAddress && item.placeAddress !== title ? item.placeAddress : '';
              div.innerHTML = title + (sub ? '<small>' + sub + '</small>' : '');
              div.addEventListener('click', function(){
                resolvePlace(item, function(lat, lng){
                  input.value = lat.toFixed(6) + ',' + lng.toFixed(6);
                  box.style.display = 'none';
                  dropPin(lat, lng);
                  try{ map.setCenter([lng, lat]); map.setZoom(12); }catch(e){}
                });
              });
              box.appendChild(div);
            });
            box.style.display = 'block';
          })
          .catch(function(){ box.style.display = 'none'; });
      }, 350);
    });
    document.addEventListener('click', function(e){
      if(!box.contains(e.target) && e.target !== input) box.style.display = 'none';
    });
  }

  function resolvePlace(item, cb){
    if(item.latitude && item.longitude){
      cb(parseFloat(item.latitude), parseFloat(item.longitude));
    } else if(item.lat && item.lng){
      cb(parseFloat(item.lat), parseFloat(item.lng));
    } else {
      setStatus('Is jagah ki exact location nahi mili, dusra suggestion try karo.', true);
    }
  }

  wireSuggest('pt-source', 'suggest-source');
  wireSuggest('pt-dest', 'suggest-dest');

  // ---- Current location ----
  document.getElementById('useMyLocBtn').addEventListener('click', function(){
    if(!navigator.geolocation){
      setStatus('Ye browser location share nahi kar sakta.', true);
      return;
    }
    setStatus('Location le rahe hain...');
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      document.getElementById('pt-source').value = lat.toFixed(6) + ',' + lng.toFixed(6);
      dropPin(lat, lng);
      try{ map.setCenter([lng, lat]); map.setZoom(13); }catch(e){}
      setStatus('Current location mil gayi.');
    }, function(err){
      setStatus('Location nahi mili: ' + err.message, true);
    });
  });

  // ---- Traffic toggle (rebuild map with traffic option - most reliable way this SDK supports it) ----
  document.getElementById('showTraffic').addEventListener('change', function(e){
    setStatus(e.target.checked ? 'Traffic on ho raha hai...' : 'Traffic off ho raha hai...');
    buildMap(e.target.checked);
  });

  function handleMapClick(lat, lng){
    var val = lat.toFixed(6) + ',' + lng.toFixed(6);
    var srcInput = document.getElementById('pt-source');
    var destInput = document.getElementById('pt-dest');
    if(!srcInput.value){
      srcInput.value = val;
    } else if(!destInput.value){
      destInput.value = val;
    } else {
      addStopRow(val);
    }
    dropPin(lat, lng);
  }

  function dropPin(lat, lng, isReplay){
    try{
      var m = new mappls.Marker({ map: map, position: {lat:lat, lng:lng} });
      clickMarkers.push(m);
    }catch(e){ /* best-effort visual marker */ }
    if(!isReplay) allPoints.push({lat:lat, lng:lng});
  }

  var stopCounter = 0;
  function addStopRow(prefill){
    var container = document.getElementById('stops-container');
    var id = 'stop-' + (stopCounter++);
    var row = document.createElement('div');
    row.className = 'stop-item';
    row.style.position = 'relative';
    row.innerHTML = '<input type="text" class="stop-input" id="' + id + '" placeholder="Jagah ka naam ya lat,lng" autocomplete="off">'
      + '<div class="suggest-box" id="suggest-' + id + '" style="top:34px"></div>'
      + '<button type="button" onclick="this.parentElement.remove()">✕</button>';
    if(prefill) row.querySelector('input').value = prefill;
    container.appendChild(row);
    wireSuggest(id, 'suggest-' + id);
  }
  document.getElementById('addStopBtn').addEventListener('click', function(){ addStopRow(); });
  document.getElementById('clearBtn').addEventListener('click', function(){
    document.getElementById('pt-source').value='';
    document.getElementById('pt-dest').value='';
    document.getElementById('stops-container').innerHTML='';
    document.getElementById('result').innerHTML='';
    setStatus('');
    stopNavigation();
    clickMarkers.forEach(function(m){ try{ m.remove(); }catch(e){} });
    clickMarkers = [];
    allPoints = [];
    lastRouteGeometry = null;
    routeSteps = [];
    destCoord = null;
    document.getElementById('startNavBtn').disabled = true;
    if(routeLayerAdded){
      try{ map.removeLayer('route-line'); map.removeSource('route-src'); }catch(e){}
      routeLayerAdded = false;
    }
  });

  function parseLatLng(str){
    var parts = str.split(',').map(function(s){ return parseFloat(s.trim()); });
    if(parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
    return parts; // [lat, lng]
  }

  document.getElementById('getRouteBtn').addEventListener('click', function(){
    var srcRaw = document.getElementById('pt-source').value.trim();
    var destRaw = document.getElementById('pt-dest').value.trim();
    var src = parseLatLng(srcRaw);
    var dest = parseLatLng(destRaw);
    if(!src || !dest){
      setStatus('Source aur Destination dono "lat,lng" format mein sahi bharo.', true);
      return;
    }
    var stopInputs = document.querySelectorAll('.stop-input');
    var stops = [];
    stopInputs.forEach(function(inp){
      var v = parseLatLng(inp.value.trim());
      if(v) stops.push(v);
    });

    var coordsArr = [src].concat(stops).concat([dest]);
    var coordsStr = coordsArr.map(function(p){ return p[1] + ',' + p[0]; }).join(';');

    var btn = document.getElementById('getRouteBtn');
    btn.disabled = true;
    setStatus('Route nikala ja raha hai...');
    document.getElementById('result').innerHTML = '';

    var qs = new URLSearchParams({
      coords: coordsStr,
      height: document.getElementById('height').value,
      width: document.getElementById('width').value,
      length: document.getElementById('length').value,
      weight: document.getElementById('weight').value,
      axle_load: document.getElementById('axle_load').value,
      hazmat: document.getElementById('hazmat').checked ? 'true' : 'false',
      avoidToll: document.getElementById('avoidToll').checked ? 'true' : 'false'
    });

    fetch('/api/route?' + qs.toString())
      .then(function(r){ return r.json().then(function(data){ return {ok:r.ok, status:r.status, data:data}; }); })
      .then(function(res){
        btn.disabled = false;
        if(!res.ok){
          setStatus('API error (' + res.status + '). Neeche raw response dekho.', true);
          renderRaw(res.data);
          return;
        }
        setStatus('Route mil gaya.');
        renderResult(res.data);
      })
      .catch(function(err){
        btn.disabled = false;
        setStatus('Error: ' + err.message, true);
      });
  });

  function renderRaw(data){
    var div = document.getElementById('result');
    var d = document.createElement('details');
    d.innerHTML = '<summary>Raw API response</summary><pre>' + JSON.stringify(data, null, 2) + '</pre>';
    div.appendChild(d);
  }

  function renderResult(data){
    var div = document.getElementById('result');
    div.innerHTML = '';
    var route = data && data.routes && data.routes[0];
    if(!route){
      div.innerHTML = '<div class="stat">Route nahi mila. Points ya truck details check karo.</div>';
      renderRaw(data);
      return;
    }
    var distKm = route.distance ? (route.distance/1000).toFixed(1) : 'N/A';
    var durMin = route.duration ? Math.round(route.duration/60) : 'N/A';
    var toll = route.toll ? route.toll > 0 : (route.has_toll || false);
    var restricted = route.restricted ? route.restricted > 0 : (route.has_time_restrictions || false);
    var ferry = route.ferry ? route.ferry > 0 : false;

    // best-effort: pick up traffic-adjusted duration under whichever field name the API actually sent
    var trafficSecs = route.duration_in_traffic || route.durationInTraffic || route.traffic_duration
      || route.duration_traffic || (route.traffic && route.traffic.duration) || null;
    var trafficMin = trafficSecs ? Math.round(trafficSecs/60) : null;
    var extraMin = (trafficMin && durMin !== 'N/A') ? (trafficMin - durMin) : null;

    var trafficRow = '';
    if(trafficMin){
      trafficRow = '<div>Traffic ke saath time: <b>' + trafficMin + ' min</b>'
        + (extraMin > 0 ? ' <span style="color:#f87171">(+' + extraMin + ' min traffic ki wajah se)</span>' : ' <span style="color:#4ade80">(traffic clear)</span>')
        + '</div>';
    } else {
      trafficRow = '<div style="font-size:11px;color:var(--muted)">Traffic-adjusted time is response mein nahi mila — "Show live traffic" checkbox se map par traffic dikh jaayega, lekin ETA mein add nahi ho paya.</div>';
    }

    var html = '<div class="stat">'
      + '<div>Distance: <b>' + distKm + ' km</b></div>'
      + '<div>Est. Time: <b>' + durMin + ' min</b></div>'
      + trafficRow
      + '<div>'
      + '<span class="flag ' + (toll ? 'on' : 'off') + '">' + (toll ? '⚠ Toll on route' : '✓ No toll') + '</span>'
      + '<span class="flag ' + (restricted ? 'on' : 'off') + '">' + (restricted ? '⚠ Restricted segment' : '✓ No restriction') + '</span>'
      + (ferry ? '<span class="flag on">⚠ Ferry involved</span>' : '')
      + '</div></div>';

    if(restricted){
      html += '<div style="background:rgba(239,68,68,.15);border:1px solid var(--danger);border-radius:8px;padding:10px;margin-bottom:8px;">'
        + '<b style="color:#f87171;">🚫 Ye road truck ke liye restricted hai</b>'
        + '<div style="font-size:11px;color:var(--muted);margin-top:4px;">Route mein wo hissa map par LAL (red) rang mein dikhaya gaya hai. Chota/prohibited road hoga to red, normal-fit road GREEN.</div>'
        + '</div>';
    }
    div.innerHTML = html;
    renderRaw(data);

    lastRestricted = restricted;
    routeSteps = extractSteps(route);

    // best-effort: mark individual restricted points red if the API flagged any step/intersection as restricted
    var restrictedPoints = [];
    (route.legs || []).forEach(function(leg){
      (leg.steps || []).forEach(function(s){
        var flagged = s.restricted || s.restriction || (s.intersections || []).some(function(i){ return i.restricted; });
        if(flagged && s.maneuver && s.maneuver.location) restrictedPoints.push(s.maneuver.location);
      });
    });

    try{
      var geometry = route.geometry;
      if(geometry && geometry.coordinates){
        lastRouteGeometry = geometry;
        destCoord = geometry.coordinates[geometry.coordinates.length - 1]; // [lng, lat]
        document.getElementById('startNavBtn').disabled = false;

        if(routeLayerAdded){
          map.getSource('route-src').setData({type:'Feature', geometry: geometry});
        } else {
          map.addSource('route-src', { type:'geojson', data: {type:'Feature', geometry: geometry} });
          map.addLayer({
            id:'route-line', type:'line', source:'route-src',
            paint: { 'line-color': restricted ? '#ef4444' : '#22c55e', 'line-width': 5 }
          });
          routeLayerAdded = true;
        }
        restrictedPoints.forEach(function(loc){
          try{
            var rm = new mappls.Marker({ map: map, position: {lat: loc[1], lng: loc[0]}, fillColor: '#ef4444' });
            clickMarkers.push(rm);
          }catch(e){}
        });
        var coords = geometry.coordinates;
        if(coords.length){
          var bounds = coords.reduce(function(b,c){
            return [[Math.min(b[0][0],c[0]), Math.min(b[0][1],c[1])], [Math.max(b[1][0],c[0]), Math.max(b[1][1],c[1])]];
          }, [[coords[0][0],coords[0][1]],[coords[0][0],coords[0][1]]]);
          try{ map.fitBounds(bounds, {padding:40}); }catch(e){}
        }
      }
    }catch(e){ /* stats above still show even if drawing fails */ }
  }

  // ---- Turn-by-turn steps from the route response (best-effort, schema may vary) ----
  function extractSteps(route){
    var steps = [];
    (route.legs || []).forEach(function(leg){
      (leg.steps || []).forEach(function(s){
        if(s.maneuver && s.maneuver.location){
          steps.push({
            instruction: (s.maneuver.instruction) || ('Continue' + (s.name ? (' on ' + s.name) : '')),
            loc: s.maneuver.location // [lng, lat]
          });
        }
      });
    });
    return steps;
  }

  function haversineKm(lat1, lon1, lat2, lon2){
    var R = 6371, dLat = (lat2-lat1) * Math.PI/180, dLon = (lon2-lon1) * Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ---- Live navigation (drive mode) ----
  var navWatchId = null, navMarker = null, routeSteps = [], destCoord = null, passedStepCount = 0;

  document.getElementById('startNavBtn').addEventListener('click', startNavigation);
  document.getElementById('stopNavBtn').addEventListener('click', stopNavigation);

  function startNavigation(){
    if(!navigator.geolocation){
      setStatus('Ye browser live location share nahi kar sakta.', true);
      return;
    }
    if(!destCoord){
      setStatus('Pehle route calculate karo.', true);
      return;
    }
    passedStepCount = 0;
    document.getElementById('startNavBtn').style.display = 'none';
    document.getElementById('stopNavBtn').style.display = 'block';
    document.getElementById('navBanner').style.display = 'block';
    setStatus('Navigation shuru ho gaya — live location track ho rahi hai.');

    navWatchId = navigator.geolocation.watchPosition(function(pos){
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      updateNavMarker(lat, lng);
      try{ map.setCenter([lng, lat]); map.setZoom(16); }catch(e){}
      updateNavBanner(lat, lng);
    }, function(err){
      setStatus('Live location error: ' + err.message, true);
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
  }

  function stopNavigation(){
    if(navWatchId !== null){ navigator.geolocation.clearWatch(navWatchId); navWatchId = null; }
    document.getElementById('startNavBtn').style.display = 'block';
    document.getElementById('stopNavBtn').style.display = 'none';
    document.getElementById('navBanner').style.display = 'none';
    if(navMarker){ try{ navMarker.remove(); }catch(e){} navMarker = null; }
  }

  function updateNavMarker(lat, lng){
    try{
      if(navMarker){ navMarker.setPosition({lat:lat, lng:lng}); }
      else { navMarker = new mappls.Marker({ map: map, position: {lat:lat, lng:lng}, fitbounds:false }); }
    }catch(e){ /* best-effort */ }
  }

  function updateNavBanner(lat, lng){
    var instrEl = document.getElementById('navInstruction');
    var distEl = document.getElementById('navDistance');

    // find the next un-passed step (nearest ahead)
    var nextStep = null, nextDist = Infinity;
    for(var i = passedStepCount; i < routeSteps.length; i++){
      var s = routeSteps[i];
      var d = haversineKm(lat, lng, s.loc[1], s.loc[0]);
      if(d < 0.05){ passedStepCount = i + 1; continue; } // within 50m, treat as passed
      if(d < nextDist){ nextDist = d; nextStep = s; }
      break; // steps are sequential, stop at first upcoming one
    }

    if(nextStep){
      instrEl.textContent = '➡ ' + nextStep.instruction;
      distEl.textContent = (nextDist*1000 < 950 ? Math.round(nextDist*1000) + ' m' : nextDist.toFixed(1) + ' km') + ' mein';
    } else {
      instrEl.textContent = 'Seedhe chalte raho';
      distEl.textContent = '';
    }

    if(destCoord){
      var remKm = haversineKm(lat, lng, destCoord[1], destCoord[0]);
      distEl.textContent += (distEl.textContent ? '  •  ' : '') + 'Destination: ' + remKm.toFixed(1) + ' km baaki';
      if(remKm < 0.05){
        instrEl.textContent = '🏁 Aap destination pahunch gaye!';
        setTimeout(stopNavigation, 3000);
      }
    }
  }
</script>
</body>
</html>
